# Open Whisper configuration. The app copies this to
# ~/Library/Application Support/Open Whisper/config.yaml on first run;
# edit that copy (or use the menu bar) — not this file.

# Whisper model: tiny, base, small, distil-medium, medium, distil-large,
# turbo, large. Turbo is the best speed/quality balance on Apple Silicon.
transcription_model: turbo

# Hold this key to record, release to transcribe. Single key or a combo
# joined with '+', e.g. alt_r+shift_r.
trigger_key: shift_r

language: en
min_duration: 0.5     # ignore recordings shorter than this (seconds)
max_duration: 300     # auto-stop after this long (seconds)
release_delay: 0.05   # pause between key release and paste (seconds)
sample_rate: 16000

sound_enabled: false        # tink/pop sounds on record start/stop
overlay_enabled: true       # floating pill while recording/processing
overlay_translucent: true   # Liquid Glass pill vs solid capsule

# Domain terms (acronyms, names) Whisper should favour.
vocabulary: []

# Stubborn mishearings, replaced whole-word after transcription.
# e.g.  ethanol: FNOL
phonetic_corrections: {}

# Audio input device name; null uses the system default.
input_device: null

advanced:
  # Trim leading/trailing silence before transcription.
  trim_silence_enabled: true
  # Transcribe long dictations in chunks at natural pauses while you're
  # still speaking, so the wait after key release stays short.
  streaming_transcribe_enabled: true
  # Inject short transcripts as keystrokes instead of clipboard paste.
  fast_typing_enabled: true
  fast_typing_max_chars: 80
  # Seconds the dictation stays on the clipboard after the paste, before
  # your previous clipboard contents are put back. The focused app reads
  # the pasteboard whenever it processes our Cmd+V, so restoring too early
  # makes a busy app paste your old clipboard instead of the dictation.
  # Set 0 to never restore, leaving the dictation on the clipboard.
  clipboard_restore_delay: 1.5
