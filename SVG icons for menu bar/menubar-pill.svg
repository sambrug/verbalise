    M 326,373 H 698 A 139,139 0 0 1 698,651 H 326 A 139,139 0 0 1 326,373 Z
    M 385.4375,488.5625 A 14.0625,14.0625 0 0 1 413.5625,488.5625 L 413.5625,535.4375 A 14.0625,14.0625 0 0 1 385.4375,535.4375 Z
    M 441.6875,451.0625 A 14.0625,14.0625 0 0 1 469.8125,451.0625 L 469.8125,572.9375 A 14.0625,14.0625 0 0 1 441.6875,572.9375 Z
    M 497.9375,413.5625 A 14.0625,14.0625 0 0 1 526.0625,413.5625 L 526.0625,610.4375 A 14.0625,14.0625 0 0 1 497.9375,610.4375 Z
    M 554.1875,451.0625 A 14.0625,14.0625 0 0 1 582.3125,451.0625 L 582.3125,572.9375 A 14.0625,14.0625 0 0 1 554.1875,572.9375 Z
    M 610.4375,488.5625 A 14.0625,14.0625 0 0 1 638.5625,488.5625 L 638.5625,535.4375 A 14.0625,14.0625 0 0 1 610.4375,535.4375 Z
  "/>
