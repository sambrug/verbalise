<svg xmlns="http://www.w3.org/2000/svg" width="372" height="278" viewBox="326 373 372 278">
  <title>Open Whisper — menu bar mark, resting</title>
  <!--
    The app icon's own glyph, cropped from AppIcon.icon/Assets/pill-glyph.svg
    to the mark's bounds so it fills the image rather than sitting in a
    1024pt field of nothing.

    Kept in the same coordinate space as menubar-bars.svg, so the bars land in
    exactly the same place in both states and the icon does not appear to
    resize when recording starts.
  -->
